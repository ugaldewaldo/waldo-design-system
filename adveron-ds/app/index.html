<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adveron components</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../waldo-ui/waldo-shadcn-theme.css">
<link rel="stylesheet" href="../../waldo-ds.css">
<style>
  /* Page layout only. Every color, size and radius is a DS token; the
     segmented control is the canonical waldo-ds.css class. */
  body { margin: 0; background: hsl(var(--background)); color: hsl(var(--foreground)); }
  .ab-page { max-width: 1040px; margin: 0 auto; padding: 48px 24px 120px; }

  .ab-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .ab-title { font-size: var(--fs-2xl); font-weight: 500; letter-spacing: -0.02em; margin: 0; }
  .ab-lede { font-size: var(--fs-sm); color: hsl(var(--muted-foreground)); margin: 6px 0 0; max-width: 560px; line-height: 1.55; }

  .ab-jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 32px 0 24px; }
  .ab-jump a { font-size: var(--fs-xs); color: hsl(var(--muted-foreground)); text-decoration: none; padding: 4px 10px; border-radius: var(--radius-full); background: hsl(var(--foreground) / 0.05); }
  .ab-jump a:hover { color: hsl(var(--foreground)); background: hsl(var(--foreground) / 0.10); }

  .ab-item { background: hsl(var(--card)); border-radius: var(--radius-xl); padding: 20px 24px 8px; margin-bottom: 16px; scroll-margin-top: 24px; }
  .ab-item-name { font-size: var(--fs-lg); font-weight: 500; letter-spacing: -0.02em; margin: 0 0 12px; }
  .ab-item iframe { display: block; width: 100%; border: 0; border-radius: var(--radius-lg); background: transparent; }

  .ab-down { background: hsl(var(--card)); border-radius: var(--radius-xl); padding: 20px 24px; margin-top: 32px; font-size: var(--fs-sm); color: hsl(var(--muted-foreground)); line-height: 1.6; }
  .ab-down strong { color: hsl(var(--foreground)); font-weight: 500; }
</style>
</head>
<body>
<main class="ab-page">
  <div class="ab-top">
    <div>
      <h1 class="ab-title">Adveron components</h1>
      <p class="ab-lede">The official starting point: every component exactly as Adveron ships it today. From here on, any change to one of them comes to review before it counts.</p>
    </div>
    <div class="wseg" role="group" aria-label="Theme">
      <button class="wseg-opt active" data-theme="light">Light</button>
      <button class="wseg-opt inactive" data-theme="dark">Dark</button>
    </div>
  </div>

  <div class="ab-down" id="down" hidden><strong>The component gallery is not running.</strong> Ask Claude to start it, then reload.</div>

  <nav class="ab-jump" id="jump"></nav>
  <div id="components"></div>
</main>

<script>
  const ADVERON = 'http://localhost:4510';
  // Overlays render inside their frame, so the frame needs room to show them open.
  const OVERLAY = new Set(['dialog', 'sheet', 'dropdown-menu', 'popover', 'tooltip', 'command']);

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const title = (id) => id.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');

  // Adveron's own default is light, so the page opens in light.
  let theme = 'light';
  document.documentElement.classList.replace('dark', 'light');

  const frameUrl = (id) => `${ADVERON}/?${new URLSearchParams({ embed: '1', theme, only: id })}`;

  function renderComponent(e) {
    return `<article class="ab-item" id="${esc(e.id)}">
      <h2 class="ab-item-name">${esc(title(e.id))}</h2>
      <iframe height="160" loading="lazy" title="${esc(title(e.id))}" data-id="${esc(e.id)}" src="${esc(frameUrl(e.id))}"></iframe>
    </article>`;
  }

  // Frames report their own height; size each to its specimen.
  window.addEventListener('message', (ev) => {
    if (!ev.data || ev.data.type !== 'gallery-height') return;
    for (const f of document.querySelectorAll('iframe')) {
      if (f.contentWindow !== ev.source) continue;
      const floor = OVERLAY.has(f.dataset.id) ? 380 : 0;
      f.height = String(Math.max(floor, ev.data.height));
    }
  });

  for (const b of document.querySelectorAll('.wseg-opt')) {
    b.addEventListener('click', () => {
      theme = b.dataset.theme;
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.classList.toggle('light', theme === 'light');
      for (const o of document.querySelectorAll('.wseg-opt')) {
        o.classList.toggle('active', o === b);
        o.classList.toggle('inactive', o !== b);
      }
      for (const f of document.querySelectorAll('iframe')) {
        const u = new URL(f.src);
        u.searchParams.set('theme', theme);
        f.src = u.toString();
      }
    });
  }

  // The component list is the baseline's own file list, so it can never drift from it.
  fetch('history.json')
    .then((r) => r.json())
    .then((d) => {
      document.getElementById('jump').innerHTML = d.components.map((e) => `<a href="#${esc(e.id)}">${esc(title(e.id))}</a>`).join('');
      document.getElementById('components').innerHTML = d.components.map(renderComponent).join('');
      fetch(ADVERON, { mode: 'no-cors' }).catch(() => { document.getElementById('down').hidden = false; });
    });
</script>
</body>
</html>
